name: release

# Publishes to npm whenever a tag matching `v*` is pushed.
#
# Workflow:
#   1. Bump version in package.json — `npm version patch` (or minor / major).
#   2. `git push origin main --follow-tags` (this is what triggers the job).
#   3. The job validates the tag matches package.json, builds with bun,
#      then publishes the dist/ + manifest.
#
# Required repo secret:
#   NPM_TOKEN — granular access token from npmjs.com with "bypass 2FA"
#               enabled, read+write scoped to @meappy/*

on:
  push:
    tags: ['v*']

permissions:
  contents: write       # to create the GitHub Release
  id-token: write       # for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          scope: "@meappy"

      - name: Confirm tag matches package.json version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="$(node -p 'require(\"./package.json\").version')"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "tag $TAG matches package.json $PKG"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Publish to npm
        # Skipping prepublishOnly because we already built above (and
        # prepublishOnly would re-run npm run build via npm, not bun).
        run: npm publish --access public --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
