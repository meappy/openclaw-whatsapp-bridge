name: release

# Publishes to npm whenever a tag matching `v*` is pushed.
#
# Workflow:
#   1. Bump version in package.json — `npm version patch` (or minor / major).
#   2. `git push origin main --follow-tags` (this is what triggers the job).
#   3. The job validates the tag matches package.json, then publishes.
#
# Required org/repo secret:
#   NPM_TOKEN — automation token from npmjs.com → Account → Access Tokens
#               (Granular access token, "Publish" permission scoped to
#                @meappy/openclaw-whatsapp-bridge if possible)

on:
  push:
    tags: ['v*']

permissions:
  contents: write       # to create the GitHub Release
  id-token: write       # for npm provenance (optional but recommended)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          scope: "@meappy"

      - name: Confirm tag matches package.json version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="$(node -p 'require(\"./package.json\").version')"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "tag $TAG matches package.json $PKG"

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
